<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profil Saya</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #2563eb
    );
    overflow:hidden;
}

/* Background Animasi */
body::before,
body::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    animation:float 8s ease-in-out infinite;
}

body::before{
    width:300px;
    height:300px;
    background:#60a5fa;
    top:-100px;
    left:-100px;
}

body::after{
    width:250px;
    height:250px;
    background:#3b82f6;
    bottom:-100px;
    right:-100px;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(30px);
    }
}

.card{
    position:relative;
    width:400px;
    padding:35px;
    text-align:center;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:25px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    color:white;
    animation:slideUp 1s ease;
}

@keyframes slideUp{
    from{
        opacity:0;
        transform:translateY(50px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.profile-img{
    width:170px;
    height:170px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid rgba(255,255,255,0.3);
    transition:0.5s;
}

.profile-img:hover{
    transform:scale(1.08) rotate(5deg);
    box-shadow:0 0 30px #60a5fa;
}

h1{
    margin-top:15px;
    font-size:30px;
}

.job{
    color:#cbd5e1;
    margin-top:5px;
    margin-bottom:20px;
}

.info{
    text-align:left;
    margin-top:20px;
}

.info p{
    margin:12px 0;
    padding:10px;
    background:rgba(255,255,255,0.08);
    border-radius:10px;
    transition:0.3s;
}

.info p:hover{
    transform:translateX(8px);
    background:rgba(255,255,255,0.15);
}

.label{
    font-weight:bold;
    color:#93c5fd;
}

.social{
    margin-top:25px;
}

.social a{
    display:inline-block;
    text-decoration:none;
    color:white;
    margin:0 8px;
    padding:12px 18px;
    border-radius:30px;
    background:rgba(255,255,255,0.15);
    transition:0.3s;
}

.social a:hover{
    background:#2563eb;
    transform:translateY(-5px);
}

.btn{
    display:inline-block;
    margin-top:25px;
    padding:12px 25px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:30px;
    transition:0.4s;
}

.btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 20px #60a5fa;
}
</style>
</head>
<body>

<div class="card">

    <img src="profil.jpg" alt="Foto Profil" class="profile-img">

    <h1>Muhammad Arifin Ilham</h1>
    <p class="job">Mahasiswa Teknik Informatika</p>

    <div class="info">
        <p><span class="label">NPM :</span> 2410010106</p>
        <p><span class="label">Kampus :</span> Uniska</p>
        <p><span class="label">Email :</span> arifinilham312005@gmail.com</p>
        <p><span class="label">Alamat :</span> Marabahan</p>
        <p><span class="label">Hobi :</span> Coding, Gaming, Membaca</p>
    </div>

    <div class="social">
        <a href="#">Instagram</a>
        <a href="#">GitHub</a>
        <a href="#">LinkedIn</a>
    </div>

    <a href="#" class="btn">Hubungi Saya</a>

</div>

</body>
</html>
